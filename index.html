<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens ===== */
:root{
  --forest:#1D4A34; --forest-deep:#11301F; --sage:#A3BFA0; --sage-soft:#E4EDE2; --mist:#F3F7F2; --ink:#142219;
  --bg:#FFFFFF; --surface:var(--mist); --surface-2:var(--sage-soft); --text:var(--ink); --muted:#475B4E; --line:#D2DDD0;
  --band:var(--forest-deep); --band-text:#FFFFFF; --band-muted:#C9D9C6; --band-line:rgba(255,255,255,.18);
  --btn:var(--forest); --btn-text:#FFFFFF; --btn-hover:var(--forest-deep);
  --link:var(--forest); --focus:#2F7A55; --warn-bg:#FFF7E0; --warn-text:#5C4300; --warn-line:#E6CF8A;
  --error:#A3261B; --ok:#1D4A34;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:10px;
  --wrap:1180px; --gutter:clamp(1.15rem, 4vw, 2.5rem);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A13; --surface:#13251B; --surface-2:#1A3125; --text:#E7EFE8; --muted:#A9BEAE; --line:#28402F;
    --band:#163526; --band-muted:#BFD3BC; --btn:#A3BFA0; --btn-text:#0D1A13; --btn-hover:#C3D8C0;
    --link:#B7D2B3; --focus:#B7D2B3; --warn-bg:#2B2410; --warn-text:#F0DFA6; --warn-line:#5E4F22; --error:#FF9C90; --ok:#B7D2B3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A13; --surface:#13251B; --surface-2:#1A3125; --text:#E7EFE8; --muted:#A9BEAE; --line:#28402F;
  --band:#163526; --band-muted:#BFD3BC; --btn:#A3BFA0; --btn-text:#0D1A13; --btn-hover:#C3D8C0;
  --link:#B7D2B3; --focus:#B7D2B3; --warn-bg:#2B2410; --warn-text:#F0DFA6; --warn-line:#5E4F22; --error:#FF9C90; --ok:#B7D2B3;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
[tabindex="-1"]:focus:not(:focus-visible), h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus, main:focus{outline:none}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 88px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:1.0625rem; line-height:1.6; overflow-x:hidden}
img,svg{max-width:100%; display:block}
a{color:var(--link); text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:6px}
h1,h2,h3{font-family:var(--serif); font-weight:600; line-height:1.12; margin:0 0 .5em; letter-spacing:-.01em}
h1{font-size:clamp(2.4rem, 6vw, 4.25rem)}
h2{font-size:clamp(1.85rem, 3.6vw, 2.75rem)}
h3{font-size:1.35rem; line-height:1.25}
p{margin:0 0 1em; max-width:66ch}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 var(--gutter)}
.lede{font-size:clamp(1.125rem, 1.6vw, 1.3rem); color:var(--muted); max-width:58ch}
.visually-hidden{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:1rem; top:-100px; z-index:100; background:var(--btn); color:var(--btn-text); padding:.7rem 1rem; border-radius:var(--r-sm); font-weight:600}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + .75rem)}

/* ===== Buttons ===== */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem; min-height:48px; padding:.75rem 1.4rem; border-radius:999px; font:600 1rem/1.2 var(--sans); text-decoration:none; border:2px solid transparent; cursor:pointer; transition:background-color .18s, color .18s, border-color .18s}
.btn-primary{background:var(--btn); color:var(--btn-text)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-ghost{background:transparent; color:var(--text); border-color:var(--line)}
.btn-ghost:hover{border-color:var(--text)}
.on-band .btn-primary{background:#FFFFFF; color:var(--forest-deep)}
.on-band .btn-primary:hover{background:var(--sage-soft)}
.on-band .btn-ghost{color:#fff; border-color:rgba(255,255,255,.45)}
.on-band .btn-ghost:hover{border-color:#fff}
.btn[aria-disabled="true"], .btn:disabled{opacity:.55; cursor:not-allowed}
.btn-row{display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1.75rem}

/* ===== Placeholder markers ===== */
.ph{display:inline-block; font:500 .8125rem/1.3 var(--sans); padding:.2rem .6rem; border-radius:999px; background:var(--warn-bg); color:var(--warn-text); border:1px dashed var(--warn-line); vertical-align:middle}
.ph-inline{background:var(--warn-bg); color:var(--warn-text); border-bottom:1px dashed var(--warn-line); padding:0 .2em; border-radius:3px}
.notice{display:flex; gap:.75rem; align-items:flex-start; background:var(--warn-bg); color:var(--warn-text); border:1px solid var(--warn-line); border-radius:var(--r-md); padding:1rem 1.15rem; font-size:.9688rem}
.notice svg{flex:none; margin-top:.15rem}
.notice p{margin:0; max-width:none}

/* ===== Header ===== */
.site-header{position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.header-inner{display:flex; align-items:center; gap:1rem; min-height:76px}
.brand{display:flex; align-items:center; gap:.75rem; text-decoration:none; color:var(--text); margin-right:auto; min-width:0}
.logo-ph{flex:none; width:46px; height:46px; border-radius:50%; border:2px dashed var(--sage); display:grid; place-items:center; color:var(--forest); background:var(--surface)}
:root[data-theme="dark"] .logo-ph{color:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-ph{color:var(--sage)}}
.brand-name{display:block; font:600 1.125rem/1.15 var(--serif); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.logo{flex:none; width:52px; height:52px; border-radius:50%; overflow:hidden; background:#fff; box-shadow:0 0 0 1px var(--line)}
.logo img{width:100%; height:100%}
.footer-logo{width:88px; height:88px; border-radius:50%; background:#fff; margin-bottom:1rem}
.video-grid{display:grid; gap:1.5rem}
@media (min-width: 800px){ .video-grid{grid-template-columns:1fr 1fr} }
.video-card{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden}
.video-frame{background:#0A1610; aspect-ratio:16/9; display:grid; place-items:center}
.video-frame video{width:100%; height:100%; object-fit:contain; background:#0A1610}
.video-fallback{color:#DCE8DA; padding:1rem; text-align:center; margin:0}
.video-fallback a{color:#fff}
.video-card figcaption{padding:1.25rem 1.35rem 1.4rem}
.video-card h3{margin-bottom:.35rem}
.video-card figcaption p{color:var(--muted); font-size:.9688rem}
.brand-sub{display:block; font:500 .78rem/1.2 var(--sans); color:var(--muted)}
.nav-list{display:flex; gap:.25rem; list-style:none; margin:0; padding:0}
.nav-list a{display:block; padding:.6rem .8rem; border-radius:999px; color:var(--text); text-decoration:none; font-weight:500; font-size:.9688rem}
.nav-list a:hover{background:var(--surface)}
.nav-list a[aria-current="page"]{background:var(--surface-2); font-weight:600}
.menu-btn{display:none; align-items:center; gap:.45rem; min-height:44px; padding:.5rem .9rem; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--text); font:600 .9375rem var(--sans); cursor:pointer}
@media (max-width: 980px){
  .menu-btn{display:inline-flex}
  .site-nav{position:absolute; left:0; right:0; top:100%; background:var(--bg); border-bottom:1px solid var(--line); padding:.75rem var(--gutter) 1.25rem; display:none; box-shadow:0 18px 30px -18px rgba(17,48,31,.35)}
  .site-nav.open{display:block}
  .nav-list{flex-direction:column}
  .nav-list a{padding:.85rem 1rem; font-size:1.0625rem}
  .header-donate{padding-inline:1.1rem}
}
@media (max-width: 520px){ .brand-name{white-space:normal; font-size:.98rem; line-height:1.15} .brand-sub{display:none} .logo{width:44px; height:44px} }
@media (max-width: 420px){ .brand-sub{display:none} .brand-name{font-size:.95rem} .menu-label{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)} .menu-btn{padding:.5rem .75rem} .header-inner{gap:.6rem} .logo-ph{width:40px; height:40px} }

/* ===== Sections ===== */
.section{padding:clamp(4rem, 9vw, 7rem) 0}
.section-tight{padding:clamp(3rem, 6vw, 4.5rem) 0}
.section-alt{background:var(--surface)}
.band{background:var(--band); color:var(--band-text)}
.band p, .band .lede{color:var(--band-muted)}
.band a:not(.btn){color:#fff}
.sec-head{display:grid; gap:1rem 3rem; margin-bottom:clamp(2rem, 4vw, 3.25rem)}
@media (min-width: 900px){ .sec-head.split{grid-template-columns:1fr 1fr; align-items:end} .sec-head.split p{margin-bottom:.35rem} }
.kicker{font:500 1rem/1.3 var(--sans); color:var(--muted); margin-bottom:.65rem}
.band .kicker{color:var(--sage)}

/* ===== Hero ===== */
.hero{background:var(--band); color:#fff; padding:clamp(2.5rem, 6vw, 4.5rem) 0 clamp(3rem, 7vw, 5.5rem); position:relative; overflow:hidden}
.hero-grid{display:grid; gap:2.5rem; align-items:center}
@media (min-width: 900px){ .hero-grid{grid-template-columns:1.02fr 1fr; gap:4rem} }
.hero h1{color:#fff; max-width:14ch; font-size:clamp(2.6rem, 6.4vw, 4.6rem)}
.hero .lede{color:var(--band-muted); font-size:clamp(1.125rem, 1.7vw, 1.3rem)}
.hero-place{display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1.5rem; padding:0; list-style:none}
.hero-place li{font:500 .875rem/1 var(--sans); padding:.5rem .8rem; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--band-line); color:#E7F0E5}
.hero .photo{border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 8px}
@media (prefers-reduced-motion: no-preference){
  .hero-reveal > *{opacity:0; transform:translateY(14px); animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .hero-reveal > *:nth-child(2){animation-delay:.08s} .hero-reveal > *:nth-child(3){animation-delay:.16s} .hero-reveal > *:nth-child(4){animation-delay:.24s}
  .hero-photo-reveal{opacity:0; animation:fade .9s .2s ease forwards}
  @keyframes rise{to{opacity:1; transform:none}}
  @keyframes fade{to{opacity:1}}
}

/* ===== Page hero (inner pages) ===== */
.page-hero{background:var(--surface); padding:clamp(3rem, 7vw, 5rem) 0 clamp(2.5rem, 5vw, 3.5rem); border-bottom:1px solid var(--line)}
.page-hero h1{max-width:24ch; font-size:clamp(2.3rem, 5.4vw, 3.6rem)}
.crumbs{font-size:.9rem; color:var(--muted); margin-bottom:1rem}
.crumbs a{color:var(--muted)}

/* ===== Photo component ===== */
.photo{position:relative; margin:0; border-radius:var(--r-md); overflow:hidden; background:var(--surface-2)}
.photo img{width:100%; height:100%; object-fit:cover}
.photo-ph{position:relative; width:100%; height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:1.1rem; color:var(--forest-deep);
  background:
   radial-gradient(120% 90% at 85% 10%, rgba(255,255,255,.55), transparent 55%),
   repeating-linear-gradient(135deg, rgba(29,74,52,.06) 0 2px, transparent 2px 14px),
   linear-gradient(160deg, #CFDFCB, #9FBC9B)}
.photo-ph .ph-icon{position:absolute; top:1rem; left:1rem; opacity:.55}
.photo-ph strong{display:block; font:600 .9375rem/1.3 var(--sans)}
.photo-ph span{display:block; font-size:.84rem; line-height:1.4; opacity:.85; max-width:40ch}
.photo-ph .ph{align-self:flex-start; margin-bottom:.6rem}
.ratio-hero{aspect-ratio:4/4.4} .ratio-wide{aspect-ratio:16/10} .ratio-portrait{aspect-ratio:4/5} .ratio-square{aspect-ratio:1/1}
@media (max-width: 899px){ .ratio-hero{aspect-ratio:4/3.3} }

/* ===== About ===== */
.two-col{display:grid; gap:2.5rem; align-items:center}
@media (min-width: 900px){ .two-col{grid-template-columns:1fr 1fr; gap:4.5rem} .two-col.flip > :first-child{order:2} }
.pillars{display:grid; gap:1.25rem; margin-top:2rem; padding:0; list-style:none}
.pillars li{padding-left:1.25rem; border-left:3px solid var(--sage)}
.values-grid{margin-top:0; gap:2rem 2.5rem; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr))}
.founder{align-items:start}
.founder-quote{margin:0; padding:clamp(1.5rem,3vw,2.25rem); border-radius:var(--r-lg); background:var(--surface); border-left:4px solid var(--sage)}
.founder-quote blockquote{margin:0; font:500 1.1875rem/1.6 var(--serif); font-style:italic}
.founder-quote blockquote p{max-width:60ch}
.founder-quote figcaption{margin-top:1rem; font-weight:600}
.statement-lead{font-size:clamp(2rem, 4.2vw, 3.1rem); max-width:20ch; margin-bottom:1rem}
.pillars strong{display:block; font-family:var(--serif); font-size:1.15rem; font-weight:600; margin-bottom:.15rem}
.pillars p{margin:0; color:var(--muted)}

/* ===== Impact ===== */
.impact-grid{display:grid; grid-template-columns:1fr; border-top:1px solid var(--band-line); border-left:1px solid var(--band-line)}
@media (min-width: 560px){ .impact-grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width: 900px){ .impact-grid{grid-template-columns:repeat(3,1fr)} }
.impact-cell{padding:1.75rem 1.5rem 1.6rem; border-right:1px solid var(--band-line); border-bottom:1px solid var(--band-line); min-height:190px; display:flex; flex-direction:column; justify-content:space-between; gap:1.25rem}
.impact-value{font:600 clamp(2.4rem, 4.5vw, 3.25rem)/1 var(--serif); color:#fff}
.impact-await{display:inline-flex; align-items:center; min-height:3.25rem; font:500 .9375rem/1.3 var(--sans); color:#F4E7B9; border:1.5px dashed rgba(244,231,185,.55); border-radius:var(--r-sm); padding:.55rem .8rem}
.impact-label{font-weight:600; color:#fff; margin:0; font-size:1.0625rem; line-height:1.35}
.impact-note{font-size:.875rem; color:var(--band-muted); margin:.25rem 0 0}
.impact-light .impact-grid{border-color:var(--line)}
.impact-light .impact-cell{border-color:var(--line); background:var(--bg)}
.impact-light .impact-value, .impact-light .impact-label{color:var(--text)}
.impact-light .impact-note{color:var(--muted)}
.impact-light .impact-await{color:var(--warn-text); background:var(--warn-bg); border-color:var(--warn-line)}

/* ===== Focus areas ===== */
.focus-grid{display:grid; gap:1rem; grid-template-columns:1fr}
@media (min-width: 640px){ .focus-grid{grid-template-columns:repeat(2,1fr)} .focus-grid > .feature{grid-column:span 2} }
@media (min-width: 1000px){ .focus-grid{grid-template-columns:1.15fr 1fr 1fr} .focus-grid > .feature{grid-column:auto; grid-row:span 2; justify-content:flex-end; padding:2rem 1.85rem} .focus-grid > .feature h3{font-size:1.75rem} .focus-grid > .feature p{font-size:1.0625rem} }
.focus-card{background:var(--bg); border:1px solid var(--line); border-radius:var(--r-md); padding:1.6rem 1.5rem 1.5rem; display:flex; flex-direction:column}
.section-alt .focus-card{background:var(--bg)}
.focus-icon{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:var(--surface-2); color:var(--forest); margin-bottom:1.15rem}
:root[data-theme="dark"] .focus-icon{color:var(--sage)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .focus-icon{color:var(--sage)}}
.focus-card h3{margin-bottom:.4rem}
.focus-card p{color:var(--muted); margin:0; font-size:1rem}
.focus-card ul{margin:.9rem 0 0; padding-left:1.1rem; color:var(--muted); font-size:.9688rem}
.focus-card li{margin-bottom:.25rem}
.focus-card.feature{background:var(--band); color:#fff; border-color:transparent}
.focus-card.feature p, .focus-card.feature ul{color:var(--band-muted)}
.focus-card.feature .focus-icon{background:rgba(255,255,255,.1); color:#fff}

/* ===== Map ===== */
.map-grid{display:grid; gap:2.5rem; align-items:center}
@media (min-width: 960px){ .map-grid{grid-template-columns:.85fr 1.15fr; gap:4rem} }
.loc-path{list-style:none; margin:1.75rem 0 0; padding:0; display:grid; gap:0}
.loc-path li{display:grid; grid-template-columns:28px 1fr; gap:.85rem; align-items:start; padding-bottom:1.15rem; position:relative}
.loc-path li::before{content:""; position:absolute; left:13px; top:22px; bottom:0; width:2px; background:var(--band-line)}
.loc-path li:last-child::before{display:none}
.loc-dot{width:28px; height:28px; border-radius:50%; border:2px solid var(--sage); display:grid; place-items:center; background:var(--band); position:relative; z-index:1}
.loc-dot::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--sage)}
.loc-path li:last-child .loc-dot{background:var(--sage)} .loc-path li:last-child .loc-dot::after{background:var(--forest-deep)}
.loc-path strong{display:block; color:#fff; font-size:1.0625rem}
.loc-path span{color:var(--band-muted); font-size:.9375rem}
.map-card{background:rgba(255,255,255,.04); border:1px solid var(--band-line); border-radius:var(--r-lg); padding:clamp(1rem, 2.5vw, 1.75rem)}
.map-card figcaption{font-size:.84rem; color:var(--band-muted); margin-top:.9rem; line-height:1.45}
.map-svg text{font-family:var(--sans)}
.map-wrap{display:grid; gap:1rem}
.inset{display:grid; gap:.5rem 1.25rem; align-items:center}
@media (min-width: 520px){ .inset{grid-template-columns:200px 1fr} }
.inset p{color:var(--band-muted); font-size:.9rem; margin:0}
.inset{background:rgba(255,255,255,.05); border-radius:var(--r-md); padding:.75rem; border:1px solid var(--band-line)}
.inset h3{font:600 .9rem/1.3 var(--sans); color:#fff; margin:0 0 .4rem}

/* ===== Stories ===== */
.stories{display:grid; gap:1.25rem; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr))}
.story{display:flex; flex-direction:column; background:var(--bg); border-radius:var(--r-md); border:1px solid var(--line); overflow:hidden}
.story .photo{border-radius:0}
.story-body{padding:1.35rem 1.4rem 1.5rem; display:flex; flex-direction:column; gap:.6rem; flex:1}
.story blockquote{margin:0; font:500 1.1875rem/1.45 var(--serif); font-style:italic}
.story-meta{font-size:.9rem; color:var(--muted); margin:0}
.consent{margin-top:2rem; font-size:.9375rem; color:var(--muted); max-width:70ch}

/* ===== CTA ===== */
.cta-band{border-radius:var(--r-lg); background:var(--band); color:#fff; padding:clamp(2rem, 5vw, 3.5rem); display:grid; gap:2rem}
@media (min-width: 900px){ .cta-band{grid-template-columns:1.1fr 1fr; align-items:center} }
.cta-band h2{color:#fff}
.cta-options{display:grid; gap:.75rem; list-style:none; margin:0; padding:0}
.cta-options a{display:grid; grid-template-columns:1fr auto; gap:.25rem 1rem; align-items:center; padding:1.1rem 1.25rem; border-radius:var(--r-md); background:rgba(255,255,255,.07); border:1px solid var(--band-line); color:#fff; text-decoration:none; transition:background-color .18s}
.cta-options a:hover{background:rgba(255,255,255,.14)}
.cta-options strong{font-size:1.0625rem}
.cta-options span{grid-column:1; font-size:.9rem; color:var(--band-muted)}
.cta-options svg{grid-row:1 / span 2; grid-column:2}

/* ===== Timeline / steps ===== */
.steps{counter-reset:s; list-style:none; margin:0; padding:0; display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr))}
.steps li{counter-increment:s; padding:1.4rem 1.35rem; border-radius:var(--r-md); background:var(--bg); border:1px solid var(--line)}
.steps li::before{content:counter(s); display:grid; place-items:center; width:36px; height:36px; border-radius:50%; background:var(--surface-2); font:600 1rem var(--serif); margin-bottom:.9rem}
.steps h3{font-size:1.15rem; margin-bottom:.3rem}
.steps p{margin:0; color:var(--muted); font-size:.9688rem}
.timeline{list-style:none; margin:0; padding:0; border-left:2px solid var(--line); display:grid; gap:2rem}
.timeline li{padding-left:1.5rem; position:relative}
.timeline li::before{content:""; position:absolute; left:-8px; top:.45rem; width:14px; height:14px; border-radius:50%; background:var(--bg); border:3px solid var(--forest)}
.timeline h3{margin-bottom:.35rem}
.timeline p{color:var(--muted); margin:0}

/* ===== Info cards / lists ===== */
.info-grid{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr))}
.info{border:1px solid var(--line); border-radius:var(--r-md); padding:1.5rem; background:var(--bg)}
.info h3{margin-bottom:.4rem}
.info p{color:var(--muted); margin-bottom:.9rem}
.info p:last-child{margin-bottom:0}
.dl{display:grid; gap:0; margin:0}
.dl > div{display:grid; gap:.25rem 1.5rem; padding:1rem 0; border-bottom:1px solid var(--line)}
@media (min-width: 640px){ .dl > div{grid-template-columns:220px 1fr} }
.dl dt{font-weight:600} .dl dd{margin:0; color:var(--muted)}

/* ===== Forms ===== */
.form{display:grid; gap:1.25rem}
.field{display:grid; gap:.4rem}
.field label, .field legend{font-weight:600; font-size:.9688rem}
.field .hint{font-size:.875rem; color:var(--muted); margin:0}
.req{color:var(--muted); font-weight:500}
input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea{width:100%; font:400 1rem/1.4 var(--sans); color:var(--text); background:var(--bg); border:1.5px solid var(--line); border-radius:var(--r-sm); padding:.8rem .9rem; min-height:48px}
textarea{min-height:150px; resize:vertical}
input:hover, select:hover, textarea:hover{border-color:var(--muted)}
input:focus-visible, select:focus-visible, textarea:focus-visible{outline:3px solid var(--focus); outline-offset:1px; border-color:var(--focus)}
[aria-invalid="true"]{border-color:var(--error)!important}
.err{color:var(--error); font-size:.9rem; font-weight:500; margin:0; display:none}
.err.show{display:block}
.check{display:flex; gap:.7rem; align-items:flex-start}
.check input{width:22px; height:22px; margin:.15rem 0 0; accent-color:var(--forest); flex:none}
.check label{font-weight:400}
.form-row{display:grid; gap:1.25rem}
@media (min-width: 640px){ .form-row{grid-template-columns:1fr 1fr} }
.status{border-radius:var(--r-md); padding:1rem 1.15rem; display:none}
.status.show{display:block}
.status.ok{background:var(--surface-2); border:1px solid var(--line)}
.status.pending{background:var(--warn-bg); color:var(--warn-text); border:1px solid var(--warn-line)}
.status.bad{border:1.5px solid var(--error); color:var(--error)}
.status p{margin:.25rem 0 0; max-width:none}
fieldset{border:0; padding:0; margin:0; min-width:0}
.choice-row{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.4rem}
.choice{position:relative}
.choice input{position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer}
.choice span{display:inline-flex; align-items:center; min-height:48px; padding:.6rem 1.15rem; border-radius:999px; border:1.5px solid var(--line); font-weight:600; background:var(--bg)}
.choice input:checked + span{background:var(--btn); color:var(--btn-text); border-color:var(--btn)}
.choice input:focus-visible + span{outline:3px solid var(--focus); outline-offset:2px}
.panel{background:var(--surface); border-radius:var(--r-lg); padding:clamp(1.4rem, 3.5vw, 2.5rem); border:1px solid var(--line)}
.contact-grid{display:grid; gap:2.5rem}
@media (min-width: 900px){ .contact-grid{grid-template-columns:1.35fr 1fr; gap:3.5rem} }
.summary-box{margin-top:.5rem; padding:1rem 1.15rem; background:var(--bg); border-radius:var(--r-md); border:1px solid var(--line)}
.summary-box p{margin:0; max-width:none}

/* ===== Footer ===== */
.site-footer{background:var(--forest-deep); color:#DCE8DA; padding:clamp(3.5rem, 7vw, 5rem) 0 2rem; margin-top:0}
:root[data-theme="dark"] .site-footer{background:#08130D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .site-footer{background:#08130D}}
.site-footer a{color:#fff}
.footer-grid{display:grid; gap:2.25rem; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr))}
.site-footer h2{font:600 1rem/1.3 var(--sans); color:#fff; margin-bottom:.9rem}
.site-footer ul{list-style:none; margin:0; padding:0; display:grid; gap:.55rem}
.site-footer p{color:#C2D4BF; font-size:.9688rem}
.footer-brand .brand-name{color:#fff; font-size:1.3rem; white-space:normal; overflow:visible}
.footer-bottom{border-top:1px solid rgba(255,255,255,.14); margin-top:3rem; padding-top:1.5rem; display:flex; flex-wrap:wrap; gap:.75rem 2rem; justify-content:space-between; font-size:.875rem; color:#AFC4AC}
.site-footer .ph{background:rgba(244,231,185,.12); color:#F4E7B9; border-color:rgba(244,231,185,.4)}

.mt-0{margin-top:0} .mb-0{margin-bottom:0} .muted{color:var(--muted)}
.stack > * + *{margin-top:1rem}
.not-found{min-height:50vh; display:grid; align-content:center}
</style>
</head>

  ["fundraise","Fundraising"],["volunteer","Volunteering or skills"],["media","Media"],
];

        <div><dt>${icon("phone",18,2)} Phone</dt><dd>${SITE.phone ? `<a href="tel:${esc(SITE.phone.replace(/\s/g,""))}">${esc(SITE.phone)}</a>` : phInline("[Phone number]")}</dd></div>
        <div><dt>${icon("pin",18,2)} Location</dt><dd>${SITE.address ? esc(SITE.address) : `Luri Payam, Juba<br>Central Equatoria State<br>Republic of South Sudan<br>${phInline("[Full postal address, if any]")}`}</dd></div>

pages["/404"] = () => `<section class="section not-found"><div class="wrap">
  <h1 tabindex="-1">This page doesn't exist</h1><p class="lede">The link may be out of date. Use the menu above, or go back to the homepage.</p>

/* ===== Page behaviours ===== */
function wireVideos(){
  document.querySelectorAll(".video-frame video").forEach(v => {
    const fail = () => { v.hidden = true; v.parentElement.style.background = `linear-gradient(rgba(10,22,16,.72),rgba(10,22,16,.72)), center/cover no-repeat url(${v.getAttribute("poster")})`; const f = v.parentElement.querySelector(".video-fallback"); if (f) f.hidden = false; };
    v.addEventListener("error", fail, true); v.querySelector("source")?.addEventListener("error", fail);
  });
}
const behaviours = {
  "/contact": () => {
    const f = $("#contact-form"); if (!f) return;
    const status = $("#c-status");
    const rules = {
      "c-name": el => el.value.trim().length >= 2 ? "" : "Enter your full name.",
      "c-email": el => !el.value.trim() ? "Enter your email address." : (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value.trim()) ? "" : "Enter an email address like name@example.org."),
      "c-topic": el => el.value ? "" : "Choose what your message is about.",
      "c-msg": el => el.value.trim().length >= 20 ? "" : `Write at least 20 characters (currently ${el.value.trim().length}).`,
      "c-consent": el => el.checked ? "" : "Tick the box so we can use your details to reply.",
    };
    const check = id => { const el = $("#"+id), msg = rules[id](el), err = $("#"+id+"-err");
      err.textContent = msg; err.classList.toggle("show", !!msg); el.setAttribute("aria-invalid", msg ? "true" : "false"); return !msg; };
    Object.keys(rules).forEach(id => { const el = $("#"+id);
      el.addEventListener("blur", () => { if (el.dataset.touched) check(id); });
      el.addEventListener("input", () => { el.dataset.touched = 1; if (el.getAttribute("aria-invalid")==="true") check(id); });
      el.addEventListener("change", () => { el.dataset.touched = 1; check(id); }); });
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const results = Object.keys(rules).map(id => [id, check(id)]);
      const firstBad = results.find(r => !r[1]);
      if (firstBad){ $("#"+firstBad[0]).focus(); return; }
      if ($("#c-web").value) return; // spam trap
      const data = Object.fromEntries(new FormData(f).entries());
      const show = (cls, html) => { status.className = "status show " + cls; status.innerHTML = html; status.focus(); };
      if (!SITE.contactFormEndpoint){
        show("pending", `<strong>Your message has not been sent.</strong><p>The form is working, but message delivery is not configured yet. ${SITE.email ? `Please email us at <a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a> instead.` : "Please use the contact details on this page once they are published."}</p>`);
        return;
      }
      const b = $("#c-submit"); b.disabled = true; b.textContent = "Sending…";
      try {
        const r = await fetch(SITE.contactFormEndpoint, { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" }, body: JSON.stringify(data) });
        if (!r.ok) throw new Error(r.status);
        f.reset(); show("ok", `<strong>Message sent.</strong><p>Thank you. We will reply to ${esc(data.email)} within a few working days.</p>`);
      } catch(err){
        show("bad", `<strong>Message not sent.</strong><p>We couldn't reach our message service. Check your connection and try again${SITE.email ? `, or email <a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>` : ""}.</p>`);
      } finally { b.disabled = false; b.textContent = "Send message"; }
    });
  },
  "/donate": () => {
    const f = $("#donate-form"); if (!f) return;
    const d = SITE.donation, otherWrap = $("#other-wrap"), other = $("#d-other"), sum = $("#d-summary"), status = $("#d-status");
    const val = () => {
      const freq = f.querySelector("[name=freq]:checked").value;
      const pick = f.querySelector("[name=amount]:checked").value;
      const amt = pick === "other" ? parseInt(other.value, 10) : parseInt(pick, 10);
      const fund = $("#d-fund"); return { freq, pick, amt, fundLabel: fund.options[fund.selectedIndex].text, fund: fund.value };
    };
    const update = () => { const v = val(); otherWrap.hidden = v.pick !== "other";
      sum.textContent = (v.amt > 0) ? `You are choosing to give ${d.currency} ${v.amt}${v.freq==="monthly" ? " each month" : " once"}, directed to: ${v.fundLabel}.` : "Enter an amount to see your gift summary."; };
    f.addEventListener("change", update); other.addEventListener("input", update); update();
    f.addEventListener("submit", e => {
      e.preventDefault(); const v = val(), err = $("#d-other-err");
      if (v.pick === "other" && !(v.amt >= 1)){ err.textContent = "Enter a whole amount of 1 or more."; err.classList.add("show"); other.setAttribute("aria-invalid","true"); other.focus(); return; }
      err.classList.remove("show"); other.removeAttribute("aria-invalid");
      if (!d.checkoutUrl){
        status.className = "status show pending";
        status.innerHTML = `<strong>No payment was taken.</strong><p>Online giving will open once our secure payment provider is connected. Your choice of ${esc(d.currency)} ${v.amt} has not been saved. To give now, please <a href="#/contact?topic=general">contact us</a>.</p>`;
        status.focus(); return;
      }
      const url = new URL(d.checkoutUrl); url.searchParams.set("amount", v.amt); url.searchParams.set("frequency", v.freq); url.searchParams.set("fund", v.fund);
      window.location.href = url.toString(); // hand off to provider's hosted checkout
    });
  },
};

    </div>

/* ===== Router ===== */
const TITLES = { "/":"Home", "/about":"About us", "/our-work":"Our work", "/our-impact":"Our impact", "/get-involved":"Get involved", "/contact":"Contact", "/donate":"Donate", "/404":"Page not found" };
let firstLoad = true;
function parseHash(){
  const raw = (location.hash || "#/").slice(1) || "/";
  const [path, qs] = raw.split("?");
  return { path: path.replace(/\/+$/,"") || "/", query: Object.fromEntries(new URLSearchParams(qs || "")) };
}
function router(){
  const { path, query } = parseHash();
  const key = pages[path] ? path : "/404";
  $("#main").innerHTML = pages[key](query);
  document.title = `${TITLES[key]} | ${SITE.name}`;
  document.querySelectorAll("#nav-list a").forEach(a => a.dataset.path === path ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  closeMenu();
  behaviours[key] && behaviours[key]();
  wireVideos();
  const target = query.section && document.getElementById(query.section);
  if (target){
    target.scrollIntoView({ block:"start" });
    (target.querySelector("h2[tabindex], h1[tabindex]") || target).focus({ preventScroll:true });
  } else {
    window.scrollTo(0,0);
    if (!firstLoad){ const h = $("#main h1"); h && h.focus({ preventScroll:true }); }
  }
  if (!firstLoad) $("#route-announcer").textContent = `${TITLES[key]} page`;
  firstLoad = false;
}

/* ===== Mobile menu ===== */
const menuBtn = $("#menu-btn"), siteNav = $("#site-nav");
function closeMenu(){ siteNav.classList.remove("open"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.addEventListener("click", () => { const open = !siteNav.classList.contains("open");
  siteNav.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", String(open)); if (open) siteNav.querySelector("a").focus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && siteNav.classList.contains("open")){ closeMenu(); menuBtn.focus(); } });
document.addEventListener("click", e => { if (siteNav.classList.contains("open") && !siteNav.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(); });

/* Skip link: focus main without changing the hash route */
$(".skip").addEventListener("click", e => { e.preventDefault(); $("#main").focus(); });

renderNav(); renderFooter();
window.addEventListener("hashchange", router);
router();
</script>
